name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar TypeScript y pruebas unitarias
        run: npm test
      - name: Pruebas del mutador y de las simulaciones (Python)
        working-directory: python-runner
        run: python3 -m unittest -v test_mutador test_misiones

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imagen de producción de la API
        run: docker build --target prod -t astrocode-api .
      - name: Imagen del python-runner
        run: docker build -t astrocode-python-runner ./python-runner
      - name: Motor de misiones y caja negra con procesos aislados (dentro del contenedor)
        run: >
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL
          -v "$PWD/python-runner:/src:ro" -w /src -e PYTHONDONTWRITEBYTECODE=1
          astrocode-python-runner python -X dev -m unittest -v test_motor test_trazador test_retos_motor test_bomba test_lengua test_camara test_impostor test_nebulosa test_radio
      - name: El runner aísla el código del alumno
        run: |
          docker run -d --name runner --read-only --tmpfs /tmp --cap-drop ALL -p 5000:5000 astrocode-python-runner
          for i in $(seq 1 20); do curl -sf localhost:5000/health && break; sleep 1; done
          curl -sf -X POST localhost:5000/run -H 'Content-Type: application/json' \
            -d '{"code":"print(sum([1,2,3]))"}' | grep -qF '"stdout":"6'
          curl -sf -X POST localhost:5000/run -H 'Content-Type: application/json' \
            -d '{"code":"while True: pass"}' | grep -q '"exit_code":124'

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # docker-compose.yml hace referencia a ../Astrocode-web (no se arranca, pero la ruta tiene que existir)
      - name: Clonar la web al lado
        run: git clone --depth 1 https://github.com/michumier/Astrocode-web.git ../Astrocode-web
      - name: .env de pruebas
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ci$(openssl rand -hex 12)/" .env
      - name: Pruebas e2e contra el stack en Docker
        run: npm run e2e:docker
